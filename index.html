<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filament Outsource Tracing - Cloud Version</title>
  <!-- 引入 ExcelJS 套件 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <!-- 引入 html2pdf.js 套件 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --bg-color: #0b1329;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    /* 登入 Modal 樣式 */
    .auth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(11, 19, 41, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 32px;
      border-radius: 12px;
      width: 360px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .auth-card h2 {
      margin: 0;
      color: var(--accent);
      text-align: center;
      font-size: 1.5rem;
    }

    .auth-input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .auth-input-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .auth-input-group input {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      outline: none;
      font-size: 0.95rem;
    }

    .auth-input-group input:focus {
      border-color: var(--accent);
    }

    .auth-btns {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .auth-btns .btn {
      flex: 1;
      padding: 10px;
    }

    .auth-error {
      color: var(--danger);
      font-size: 0.82rem;
      text-align: center;
      min-height: 18px;
    }

    /* 主應用介面 */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px 24px;
      box-sizing: border-box;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      background-color: var(--bg-color);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      border-radius: 8px;
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      padding: 6px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .badge-pro {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    .sync-status {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-email {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    h1 {
      margin: 0;
      font-size: 2.8rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.1;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-shrink: 0;
      align-items: center;
    }

    .sheet-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 8px 8px 0 0;
      border: 1px solid var(--border-color);
      border-bottom: none;
      overflow-x: auto;
      flex-shrink: 0;
    }

    .sheet-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card-bg);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: grab;
      border: 1px solid var(--border-color);
      user-select: none;
    }

    .sheet-tab.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
    }

    .tab-content {
      display: none;
      flex: 1;
      min-height: 0;
      background-color: var(--card-bg);
      border-radius: 0 0 10px 10px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .tab-content.active { display: flex; flex-direction: column; }

    .toolbar {
      display: flex;
      gap: 12px;
      padding: 12px 16px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      align-items: center;
      flex-shrink: 0;
    }

    .btn {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary { background-color: #0284c7; color: #fff; border: none; }
    .btn-primary:hover { background-color: #0369a1; color: #fff; }

    .table-scroll-container {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 0 16px 12px 16px;
    }

    table { width: 100%; border-collapse: collapse; text-align: left; }

    th {
      background-color: #0f172a;
      color: #94a3b8;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 12px 16px;
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 10;
      user-select: none;
    }

    td {
      padding: 9px 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.88rem;
      color: var(--text-main);
      vertical-align: middle;
    }

    tr:hover td { background-color: rgba(255, 255, 255, 0.03); }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-width: 120px;
    }

    .progress-bar-bg {
      flex: 1;
      background: #0f172a;
      border-radius: 6px;
      height: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8, #34d399);
      border-radius: 6px;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      min-width: 38px;
      text-align: right;
    }
  </style>
</head>
<body>

  <!-- 登入驗證視窗 Modal -->
  <div id="auth-overlay" class="auth-overlay">
    <div class="auth-card">
      <h2>系統登入</h2>
      <div class="auth-input-group">
        <label>電子郵件 (Email)</label>
        <input type="email" id="auth-email" placeholder="name@company.com">
      </div>
      <div class="auth-input-group">
        <label>密碼 (Password)</label>
        <input type="password" id="auth-password" placeholder="請輸入密碼">
      </div>
      <div id="auth-error" class="auth-error"></div>
      <div class="auth-btns">
        <button id="login-btn" class="btn btn-primary">登入</button>
        <button id="register-btn" class="btn">註冊新帳號</button>
      </div>
    </div>
  </div>

  <div class="app-container">
    <header>
      <div class="brand-title">
        <img id="app-logo" class="brand-logo" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><path d='M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z'/></svg>" alt="Logo">
        <div>
          <span class="badge-pro">CLOUD ENTERPRISE</span>
          <span id="sync-indicator" class="sync-status">● 最後更新: 無紀錄</span>
          <h1>Filament Outsource Tracing</h1>
        </div>
      </div>
      <div class="user-info">
        <span id="user-display" class="user-email"></span>
        <button id="logout-btn" class="btn" style="display: none;">登出</button>
      </div>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('tracker-tab')">專案進度追蹤表</button>
      <button id="export-pdf-btn" class="btn btn-primary">一鍵匯出 PDF</button>
    </div>

    <div class="sheet-bar">
      <div id="sheets-container" style="display: flex; gap: 6px;"></div>
      <button id="add-sheet-btn" class="btn" style="padding: 2px 8px; font-size: 0.8rem;" title="新增工作表">新增工作表</button>
      <button id="copy-sheet-btn" class="btn" style="padding: 2px 8px; font-size: 0.8rem;" title="複製當前工作表">複製工作表</button>
    </div>

    <div id="tracker-tab" class="tab-content active">
      <div class="toolbar">
        <button id="add-row-btn" class="btn btn-primary">新增列</button>
        <button id="add-col-btn" class="btn btn-primary">新增自訂欄位</button>
        <button id="export-excel-btn" class="btn">匯出 Excel</button>
        <button id="import-excel-btn" class="btn">匯入 Excel</button>
        <input type="file" id="excel-file-input" accept=".xlsx, .xls" style="display: none;">
      </div>
      <!-- 匯出範圍區塊 -->
      <div class="table-scroll-container" id="pdf-export-area">
        <table>
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
  import { 
    getAuth, 
    signInWithEmailAndPassword, 
    createUserWithEmailAndPassword, 
    signOut, 
    onAuthStateChanged 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDrRzvbrpq87mDlHE8vpoAfWxwNS5aOV2E",
    authDomain: "outsourcefilament.firebaseapp.com",
    databaseURL: "https://outsourcefilament-default-rtdb.firebaseio.com",
    projectId: "outsourcefilament",
    storageBucket: "outsourcefilament.firebasestorage.app",
    messagingSenderId: "2490212071",
    appId: "1:2490212071:web:e7dd49a11c32ee4edfcc42",
    measurementId: "G-5M1XTD79JT"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const db = getDatabase(app);
  const auth = getAuth(app);

  const authOverlay = document.getElementById('auth-overlay');
  const authEmailInput = document.getElementById('auth-email');
  const authPasswordInput = document.getElementById('auth-password');
  const authError = document.getElementById('auth-error');
  const loginBtn = document.getElementById('login-btn');
  const registerBtn = document.getElementById('register-btn');
  const userDisplay = document.getElementById('user-display');
  const logoutBtn = document.getElementById('logout-btn');

  const ADMIN_EMAIL = "n1693131@gmail.com";
  let isEditable = false;

  const defaultColumns = [
    { key: "itemNo", label: "品號", isSystem: false },
    { key: "sku", label: "貨號", isSystem: false },
    { key: "purchaseNo", label: "採購料號", isSystem: false },
    { key: "startDate", label: "開始日期", isSystem: false },
    { key: "endDate", label: "結束日期", isSystem: false },
    { key: "progress", label: "進度 (%)", isSystem: false },
    { key: "status", label: "狀態", isSystem: false }
  ];

  const imgData = [
    { sku: "FVSE-0036-4", itemNo: "10091-VWNE000", purchaseNo: "50001-111" },
    { sku: "FVSE-0525-4", itemNo: "10021-VWNE000", purchaseNo: "50001-112" },
    { sku: "FVSE-0032-4", itemNo: "14967-VWNE001", purchaseNo: "50001-113" },
    { sku: "FV80-0433", itemNo: "10207-FWTE000", purchaseNo: "50001-115" }
  ];

  const initialData = imgData.map(item => ({
    itemNo: item.itemNo,
    sku: item.sku,
    purchaseNo: item.purchaseNo,
    startDate: "2026-03-01",
    endDate: "2026-03-15",
    progress: 35,
    status: "進行中"
  }));

  const defaultLogo = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><path d='M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z'/></svg>";

  let appState = {
    logoUrl: defaultLogo,
    lastUpdated: "",
    workbook: [
      { id: "sheet_1", name: "工程及製造追蹤項目", columns: defaultColumns, data: initialData },
      { id: "sheet_2", name: "採購追蹤項目", columns: defaultColumns, data: [] },
      { id: "sheet_3", name: "品保追蹤項目", columns: defaultColumns, data: [] }
    ]
  };

  let activeSheetId = "sheet_1";
  let isCloudLoaded = false;
  let userDbRef = ref(db, 'shared_app_data/outsource_filament_app');

  const logoEl = document.getElementById('app-logo');
  const syncIndicator = document.getElementById('sync-indicator');

  function getCurrentFormattedTime() {
    const now = new Date();
    return `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ` +
           `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
  }

  function getActiveSheet() {
    return appState.workbook.find(s => s.id === activeSheetId) || appState.workbook[0];
  }

  loginBtn.onclick = () => {
    const email = authEmailInput.value.trim();
    const password = authPasswordInput.value.trim();
    if (!email || !password) { authError.textContent = "請輸入 Email 與密碼"; return; }
    signInWithEmailAndPassword(auth, email, password)
      .then(() => { authError.textContent = ""; })
      .catch((err) => { authError.textContent = "登入失敗：" + err.message; });
  };

  registerBtn.onclick = () => {
    const email = authEmailInput.value.trim();
    const password = authPasswordInput.value.trim();
    if (!email || !password) { authError.textContent = "請輸入 Email 與密碼"; return; }
    createUserWithEmailAndPassword(auth, email, password)
      .then(() => { authError.textContent = ""; alert("註冊成功並已自動登入！"); })
      .catch((err) => { authError.textContent = "註冊失敗：" + err.message; });
  };

  logoutBtn.onclick = () => {
    signOut(auth).then(() => { alert("已成功登出"); });
  };

  onAuthStateChanged(auth, (user) => {
    if (user) {
      authOverlay.style.display = "none";
      userDisplay.textContent = user.email;
      logoutBtn.style.display = "inline-block";
      isEditable = (user.email === ADMIN_EMAIL);
      toggleEditingControls();
      initCloudSync();
    } else {
      authOverlay.style.display = "flex";
      userDisplay.textContent = "";
      logoutBtn.style.display = "none";
      isEditable = false;
      toggleEditingControls();
    }
  });

  function toggleEditingControls() {
    const displayVal = isEditable ? "inline-block" : "none";
    document.getElementById('add-row-btn').style.display = displayVal;
    document.getElementById('add-col-btn').style.display = displayVal;
    document.getElementById('import-excel-btn').style.display = displayVal;
    document.getElementById('add-sheet-btn').style.display = displayVal;
    document.getElementById('copy-sheet-btn').style.display = displayVal;
  }

  const cachedData = localStorage.getItem('filament_app_data');
  if (cachedData) {
    try { appState = JSON.parse(cachedData); } catch(e) { console.error(e); }
  }
  renderApp();

  function initCloudSync() {
    onValue(userDbRef, (snapshot) => {
      const data = snapshot.val();
      if (data && data.workbook && data.workbook.length > 0) {
        appState = data;
        if (!appState.logoUrl) appState.logoUrl = defaultLogo;
        if (!appState.workbook.find(s => s.id === activeSheetId)) {
          activeSheetId = appState.workbook[0].id;
        }
        localStorage.setItem('filament_app_data', JSON.stringify(appState));
        isCloudLoaded = true;
        renderApp();
      } else if (!data) {
        appState.lastUpdated = getCurrentFormattedTime();
        set(userDbRef, appState);
        isCloudLoaded = true;
        renderApp();
      }
    });
  }

  function saveData() {
    if (!isEditable) return;
    appState.lastUpdated = getCurrentFormattedTime();
    localStorage.setItem('filament_app_data', JSON.stringify(appState));
    renderApp();
    if (isCloudLoaded && auth.currentUser) {
      set(userDbRef, appState).catch(err => console.error("雲端同步失敗", err));
    }
  }

  function renderApp() {
    logoEl.src = appState.logoUrl || defaultLogo;
    syncIndicator.textContent = `● 最後更新: ${appState.lastUpdated || "無紀錄"}`;
    renderSheets();
    renderTable();
  }

  function renderSheets() {
    const sheetsContainer = document.getElementById('sheets-container');
    sheetsContainer.innerHTML = '';
    appState.workbook.forEach((sheet) => {
      const tab = document.createElement('div');
      tab.className = `sheet-tab ${sheet.id === activeSheetId ? 'active' : ''}`;
      tab.innerHTML = `<span>${sheet.name}</span>`;
      tab.onclick = () => { activeSheetId = sheet.id; renderApp(); };
      sheetsContainer.appendChild(tab);
    });
  }

  function renderTable() {
    const sheet = getActiveSheet();
    if (!sheet || !sheet.data) return;

    const thead = document.getElementById('table-head');
    const tbody = document.getElementById('table-body');

    let trHeadHtml = '<tr>';
    if (isEditable) trHeadHtml += '<th style="width: 40px; text-align: center;">≡</th>';
    sheet.columns.forEach((col) => {
      trHeadHtml += `<th>${col.label}</th>`;
    });
    if (isEditable) trHeadHtml += '<th style="width: 80px; text-align: center;">操作</th>';
    trHeadHtml += '</tr>';
    thead.innerHTML = trHeadHtml;

    tbody.innerHTML = '';
    sheet.data.forEach((row, index) => {
      const tr = document.createElement('tr');
      let trBodyHtml = '';
      if (isEditable) trBodyHtml += `<td style="text-align: center; color: var(--text-muted);">⠿</td>`;
      
      sheet.columns.forEach(col => {
        let val = row[col.key] !== undefined ? row[col.key] : '-';
        if (col.key === 'progress' || (col.label && col.label.includes('進度'))) {
          const numVal = Math.min(100, Math.max(0, parseInt(val) || 0));
          trBodyHtml += `
            <td>
              <div class="progress-container">
                <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${numVal}%;"></div></div>
                <span class="progress-text">${numVal}%</span>
              </div>
            </td>`;
        } else {
          trBodyHtml += `<td>${val}</td>`;
        }
      });

      if (isEditable) {
        trBodyHtml += `<td style="text-align: center;"><button class="action-btn" onclick="deleteRow(${index})">刪除</button></td>`;
      }
      tr.innerHTML = trBodyHtml;
      tbody.appendChild(tr);
    });
  }

  window.deleteRow = (index) => {
    if (!isEditable) return;
    const sheet = getActiveSheet();
    if (confirm("確定要刪除這筆資料嗎？")) {
      sheet.data.splice(index, 1);
      saveData();
    }
  };

  window.switchTab = (tabId) => {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    if (window.event) window.event.target.classList.add('active');
    document.getElementById(tabId).classList.add('active');
  };

  // 📄 一鍵匯出 PDF 功能（自動套用高對比深色字體，確保清晰可見）
  document.getElementById('export-pdf-btn').onclick = () => {
    const sheet = getActiveSheet();
    const element = document.getElementById('pdf-export-area');

    if (!element) {
      alert("找不到可匯出的表格區域！");
      return;
    }

    // 暫時替換區塊樣式以適應清晰的 PDF 輸出（文字加深為黑色與深灰色）
    element.style.color = "#111827";
    element.style.backgroundColor = "#ffffff";
    const cells = element.querySelectorAll('td, th');
    cells.forEach(c => {
      c.style.color = "#111827";
      c.style.borderColor = "#cbd5e1";
    });

    const opt = {
      margin:       10,
      filename:     `${sheet.name}_報表_${new Date().toISOString().slice(0,10)}.pdf`,
      image:        { type: 'jpeg', quality: 0.98 },

    html2pdf().from(element).set(opt).save().then(() => {
      // 匯出完成後恢復原畫面深色樣式

  function isImageUrl(urlStr) {
    if (typeof urlStr !== 'string') return false;
    const str = urlStr.trim();
    return str.startsWith('http://') || str.startsWith('https://') || str.startsWith('data:image');
  }

  function isProgressCol(col) {
    if (!col) return false;
    const keyMatch = col.key === 'progress';
    const labelMatch = col.label && (col.label.includes('進度') || col.label.includes('%'));

  }

        <span class="sheet-name">${sheet.name}</span>

      `;

    if (newName) {

  document.getElementById('copy-sheet-btn').onclick = () => {

    });

  function deleteSheet(sheetId, event) {

    if (appState.workbook.length <= 1) return;
    if (confirm("確定要刪除此工作表嗎？")) {
      appState.workbook = appState.workbook.filter(s => s.id !== sheetId);

  function renderTable() {
    const sheet = getActiveSheet();
    if (!sheet || !sheet.data) return;

    const thead = document.getElementById('table-head');
    const tbody = document.getElementById('table-body');

    let trHeadHtml = '<tr><th style="width: 40px; text-align: center;">≡</th>';
    sheet.columns.forEach((col, index) => {
      trHeadHtml += `
        <th class="th-col" draggable="true" data-index="${index}">
          ${col.label}
          <span class="del-col-btn" title="刪除欄位">✕</span>
        </th>`;
    });
    trHeadHtml += `<th style="width: 80px; text-align: center;">操作</th></tr>`;
    thead.innerHTML = trHeadHtml;

    thead.querySelectorAll('.th-col').forEach(th => {
      const index = Number(th.getAttribute('data-index'));
      
      th.ondblclick = () => editColumnLabel(index);
      const delBtn = th.querySelector('.del-col-btn');
      if (delBtn) delBtn.onclick = (e) => deleteColumn(sheet.columns[index].key, e);

      th.ondragstart = (e) => {
        draggedColIndex = index;
        e.dataTransfer.effectAllowed = 'move';
      };
      th.ondragover = (e) => {
        e.preventDefault();
        th.classList.add('drag-over-col');
      };
      th.ondragleave = () => {
        th.classList.remove('drag-over-col');
      };
      th.ondrop = (e) => {
        e.preventDefault();
        th.classList.remove('drag-over-col');
        if (draggedColIndex !== null && draggedColIndex !== index) {
          const movedCol = sheet.columns.splice(draggedColIndex, 1)[0];
          sheet.columns.splice(index, 0, movedCol);
          saveData();
        }
        draggedColIndex = null;
      };
    });

    tbody.innerHTML = '';
    sheet.data.forEach((row, index) => {
      const tr = document.createElement('tr');
      tr.setAttribute('draggable', 'true');
      tr.setAttribute('data-index', index);

      let trBodyHtml = `<td class="drag-handle" style="text-align: center;">⠿</td>`;
      
      sheet.columns.forEach(col => {
        let val = row[col.key] !== undefined ? row[col.key] : '-';
        
        if (isProgressCol(col)) {
          const numVal = Math.min(100, Math.max(0, parseInt(val) || 0));
          trBodyHtml += `
            <td class="editable cell-edit" data-key="${col.key}">
              <div class="progress-container">
                <div class="progress-bar-bg">
                  <div class="progress-bar-fill" style="width: ${numVal}%;"></div>
                </div>
                <span class="progress-text">${numVal}%</span>
              </div>
            </td>`;
        } else if (col.key === 'status') {
          let statusClass = 'status-todo';
          if (val === '已完成' || row.progress == 100) statusClass = 'status-done';
          else if (val === '進行中') statusClass = 'status-doing';
          
          trBodyHtml += `
            <td class="editable cell-status">
              <span class="status-badge ${statusClass}">${val || '未開始'} ▾</span>
            </td>`;
        } else if (isImageUrl(val)) {
          trBodyHtml += `
            <td class="editable cell-edit" data-key="${col.key}">
              <img src="${val}" class="table-img-preview" alt="小圖" title="雙擊可修改圖片網址">
            </td>`;
        } else {
          trBodyHtml += `<td class="editable cell-edit" data-key="${col.key}">${val}</td>`;
        }
      });

      trBodyHtml += `
        <td style="text-align: center;">
          <button class="action-btn btn-del-row" title="刪除項目">刪除</button>
        </td>`;
      tr.innerHTML = trBodyHtml;

      tr.ondragstart = (e) => {
        draggedRowIndex = index;
        e.dataTransfer.effectAllowed = 'move';
      };
      tr.ondragover = (e) => {
        e.preventDefault();
        tr.classList.add('drag-over-row');
      };
      tr.ondragleave = () => {
        tr.classList.remove('drag-over-row');
      };
      tr.ondrop = (e) => {
        e.preventDefault();
        tr.classList.remove('drag-over-row');
        if (draggedRowIndex !== null && draggedRowIndex !== index) {
          const movedRow = sheet.data.splice(draggedRowIndex, 1)[0];
          sheet.data.splice(index, 0, movedRow);
          saveData();
        }
        draggedRowIndex = null;
      };

      tr.querySelectorAll('.cell-edit').forEach(td => {
        const key = td.getAttribute('data-key');
        td.ondblclick = () => editCell(index, key);
      });

      const statusTd = tr.querySelector('.cell-status');
      if (statusTd) statusTd.onclick = () => changeStatus(index);

      const delRowBtn = tr.querySelector('.btn-del-row');
      if (delRowBtn) delRowBtn.onclick = () => deleteRow(index);

      tbody.appendChild(tr);
    });
  }

  function editColumnLabel(colIndex) {
    const sheet = getActiveSheet();
    const currentLabel = sheet.columns[colIndex].label;
    const newLabel = prompt("請修改欄位名稱：", currentLabel);
    if (newLabel && newLabel.trim() !== "") {
      sheet.columns[colIndex].label = newLabel.trim();
      saveData();
    }
  }

  function deleteColumn(colKey, event) {
    event.stopPropagation();
    const sheet = getActiveSheet();
    if (sheet.columns.length <= 1) {
      alert("至少需保留一個欄位！");
      return;
    }
    if (confirm("確定要刪除此欄位嗎？")) {
      sheet.columns = sheet.columns.filter(c => c.key !== colKey);
      saveData();
    }
  }

  function editCell(index, key) {
    const sheet = getActiveSheet();
    const col = sheet.columns.find(c => c.key === key);
    const currentVal = sheet.data[index][key] || '';
    const isProg = isProgressCol(col);
    const promptText = isProg ? '請輸入進度百分比 (0-100)：' : '請修改內容：';
    const newVal = prompt(promptText, currentVal);

    if (newVal !== null) {
      if (isProg) {
        const parsedVal = Math.min(100, Math.max(0, parseInt(newVal) || 0));
        sheet.data[index][key] = parsedVal;
        if (parsedVal === 100) sheet.data[index].status = "已完成";
        else if (parsedVal > 0 && sheet.data[index].status === "未開始") sheet.data[index].status = "進行中";
      } else {
        sheet.data[index][key] = newVal.trim();
      }
      saveData(getActiveSheetIndex(), index);
    }
  }

  function changeStatus(index) {
    const sheet = getActiveSheet();
    const currentStatus = sheet.data[index].status || '未開始';
    const selected = prompt(`請選擇狀態 (輸入數字):\n1. 未開始\n2. 進行中\n3. 已完成`, currentStatus);

    if (selected !== null) {
      let newStatus = selected.trim();
      if (newStatus === "1") newStatus = "未開始";
      if (newStatus === "2") newStatus = "進行中";
      if (newStatus === "3") newStatus = "已完成";

      if (["未開始", "進行中", "已完成"].includes(newStatus)) {
        sheet.data[index].status = newStatus;
        if (newStatus === '已完成') {
          sheet.columns.forEach(col => {
            if (isProgressCol(col)) sheet.data[index][col.key] = 100;
          });
        }
        saveData(getActiveSheetIndex(), index);
      }
    }
  }

  function deleteRow(index) {
    const sheet = getActiveSheet();
    if (confirm(`確定要刪除這筆資料嗎？`)) {
      sheet.data.splice(index, 1);
      saveData();
    }
  }

  document.getElementById('add-row-btn').onclick = () => {
    const sheet = getActiveSheet();
    if (!sheet.data) sheet.data = [];
    const newItem = {};
    sheet.columns.forEach(col => {
      newItem[col.key] = isProgressCol(col) ? 0 : col.key === 'status' ? "未開始" : "-";
    });
    sheet.data.push(newItem);
    saveData();
  };

  document.getElementById('add-col-btn').onclick = () => {
    const colLabel = prompt("請輸入新欄位名稱：");
    if (!colLabel) return;

    const sheet = getActiveSheet();
    const colKey = 'custom_' + Date.now();
    sheet.columns.push({ key: colKey, label: colLabel, isSystem: false });

    if (sheet.data) {
      sheet.data.forEach(row => { row[colKey] = "-"; });
    }

    saveData();
  };

  // 匯出 Excel 功能
  document.getElementById('export-excel-btn').onclick = async () => {
    const sheet = getActiveSheet();
    if (!sheet || !sheet.data || sheet.data.length === 0) {
      alert("當前工作表沒有可匯出的資料！");
      return;
    }

    const workbook = new ExcelJS.Workbook();
    const worksheet = workbook.addWorksheet(sheet.name);

    worksheet.columns = sheet.columns.map(col => ({
      header: col.label,
      key: col.key,
      width: 20
    }));

    sheet.data.forEach(row => {
      worksheet.addRow(row);
    });

    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${sheet.name}_${new Date().toISOString().slice(0, 10)}.xlsx`;
    a.click();
    URL.revokeObjectURL(url);
  };

  // 匯入 Excel 功能
  const excelFileInput = document.getElementById('excel-file-input');
  document.getElementById('import-excel-btn').onclick = () => {
    excelFileInput.click();
  };

  excelFileInput.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const workbook = new ExcelJS.Workbook();
    const reader = new FileReader();

    reader.onload = async (event) => {
      try {
        const buffer = event.target.result;
        await workbook.xlsx.load(buffer);
        const worksheet = workbook.worksheets[0];

        if (!worksheet) {
          alert("讀取 Excel 內容失敗！");
          return;
        }

        const newColumns = [];
        const newData = [];

        const headerRow = worksheet.getRow(1);
        headerRow.eachCell((cell, colNumber) => {
          const label = cell.value ? cell.value.toString() : `欄位_${colNumber}`;
          newColumns.push({
            key: `col_${colNumber}`,
            label: label,
            isSystem: false
          });
        });

        worksheet.eachRow((row, rowNumber) => {
          if (rowNumber === 1) return;
          const rowData = {};
          newColumns.forEach((col, index) => {
            const cellValue = row.getCell(index + 1).value;
            rowData[col.key] = cellValue !== null && cellValue !== undefined ? cellValue : "";
          });
          newData.push(rowData);
        });

        const sheet = getActiveSheet();
        sheet.columns = newColumns;
        sheet.data = newData;

        saveData();
        alert("成功匯入 Excel 資料！");
      } catch (err) {
        console.error("解析 Excel 失敗：", err);
        alert("匯入失敗，請確認檔案格式是否正確。");
      } finally {
        excelFileInput.value = "";
      }
    };

    reader.readAsArrayBuffer(file);
  };
  </script>
</body>
</html>
